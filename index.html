<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pieteikšanās sarunām ar skolotājiem</title>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('fons2.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 20px;
    }

    .top-left-header {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 100;
    }

    .logo-btn {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      transition: transform 0.2s ease;
    }
    .logo-btn:hover {
      transform: scale(1.05);
    }
    .logo-btn img {
      max-width: 180px;
      height: auto;
      display: block;
    }

    .admin-text-btn {
      color: #ffffff;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 15px;
      cursor: pointer;
      user-select: none;
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }
    .admin-text-btn:hover {
      opacity: 1;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
    }

    .container {
      max-width: 650px;
      margin: 40px auto 0 auto;
      background: rgba(255, 255, 255, 0.95);
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    h2, h3 {
      color: #333;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    select, input, textarea, button {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button.submit-btn {
      background-color: #28a745;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button.submit-btn:hover {
      background-color: #218838;
    }
    .delete-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      display: none;
    }
    .delete-btn:hover {
      background-color: #c82333;
    }
    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      display: none;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
    .admin-section {
      display: none;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px dashed #ccc;
    }
    .results-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    .results-table th, .results-table td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
      font-size: 13px;
    }
    .results-table th {
      background-color: #f2f2f2;
      color: #333;
    }
    .no-data {
      color: #777;
      font-style: italic;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="top-left-header">
  <button id="btnLogoAccess" class="logo-btn" type="button" title="Skatīties pieteikušos vecākus">
    <img src="zinatkare_balts.png" alt="Zinātkāre, kas iedvesmo! Liepājas Raiņa vidusskola">
  </button>

  <div id="btnAdminTextAccess" class="admin-text-btn" title="Administratora režīms">
    ~prāta atvērtība~<br>
    ~zinātkāre~<br>
    ~cieņa~<br>
    ~līdzatbildība~
  </div>
</div>

<div class="container">
  <h2>Pieteikšanās vecāku dienai</h2>
  
  <form id="bookingForm">
    <div class="form-group">
      <label for="building">Izvēlieties ēku:</label>
      <select id="building" required>
        <option value="">-- Izvēlieties ēku --</option>
        <option value="1">Ganību iela</option>
        <option value="2">2. ēka</option>
        <option value="3">3. ēka</option>
      </select>
    </div>

    <div class="form-group">
      <label for="teacher">Izvēlieties skolotāju:</label>
      <select id="teacher" required disabled>
        <option value="">-- Vispirms izvēlieties ēku --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="timeSlot">Izvēlieties laiku (15:00 - 18:00):</label>
      <select id="timeSlot" required disabled>
        <option value="">-- Vispirms izvēlieties skolotāju --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="studentClass">Skolēna klase:</label>
      <input type="text" id="studentClass" placeholder="piem., 5.A" required>
    </div>

    <div class="form-group">
      <label for="studentName">Skolēna Vārds Uzvārds:</label>
      <input type="text" id="studentName" placeholder="Jānis Bērziņš" required>
    </div>

    <div class="form-group">
      <label for="reason">Pieteikšanās iemesls:</label>
      <textarea id="reason" rows="3" placeholder="Īsi aprakstiet sarunas tēmu..." required></textarea>
    </div>

    <button type="submit" class="submit-btn">Apstiprināt pieteikumu</button>
  </form>

  <div id="statusMessage" class="message"></div>

  <div id="adminSection" class="admin-section">
    <h3>Skolotāja pieteikumu pārskats</h3>
    <div class="form-group">
      <label for="adminTeacherSelect">Izvēlieties skolotāju:</label>
      <select id="adminTeacherSelect">
        <option value="">-- Izvēlieties skolotāju --</option>
      </select>
    </div>

    <div id="bookingListContainer"></div>

    <button id="btnClearAllData" class="delete-btn" type="button">Dzēst visus datus</button>
  </div>
</div>

<script>
  // Aizstājiet šīs vērtības ar savām no JSONBin.io
  const JSONBIN_BIN_ID = "JUSU_BIN_ID_SEIT";
  const JSONBIN_API_KEY = "JUSU_MASTER_KEY_SEIT";

  let teachersData = { 1: [], 2: [], 3: [] };
  let allTeachers = [];

  // Skolotāju saraksta ielāde
  async function loadTeachers() {
    try {
      const [res1, res2, res3] = await Promise.all([
        fetch('eka1.txt'),
        fetch('eka2.txt'),
        fetch('eka3.txt')
      ]);

      const text1 = await res1.text();
      const text2 = await res2.text();
      const text3 = await res3.text();

      teachersData[1] = text1.split('\n').map(n => n.trim()).filter(n => n.length > 0).sort((a, b) => a.localeCompare(b, 'lv'));
      teachersData[2] = text2.split('\n').map(n => n.trim()).filter(n => n.length > 0).sort((a, b) => a.localeCompare(b, 'lv'));
      teachersData[3] = text3.split('\n').map(n => n.trim()).filter(n => n.length > 0).sort((a, b) => a.localeCompare(b, 'lv'));

      allTeachers = [...teachersData[1], ...teachersData[2], ...teachersData[3]].sort((a, b) => a.localeCompare(b, 'lv'));

      adminTeacherSelect.innerHTML = '<option value="">-- Izvēlieties skolotāju --</option>';
      allTeachers.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        adminTeacherSelect.appendChild(opt);
      });

    } catch (error) {
      console.error('Kļūda nolasot skolotāju failus:', error);
    }
  }

  // Pieteikumu nolasīšana no JSONBin
  async function getBookings() {
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
        headers: { 'X-Master-Key': JSONBIN_API_KEY }
      });
      const data = await res.json();
      return data.record || [];
    } catch (e) {
      console.error('Kļūda ielādējot datus:', e);
      return [];
    }
  }

  // Pieteikumu saglabāšana JSONBin
  async function saveBookings(updatedBookings) {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_API_KEY
      },
      body: JSON.stringify(updatedBookings)
    });
    return res.ok;
  }

  function generateTimeSlots() {
    const slots = [];
    let start = 15 * 60;
    const end = 18 * 60;
    while (start < end) {
      const hours = Math.floor(start / 60);
      const minutes = start % 60;
      slots.push(`${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`);
      start += 15;
    }
    return slots;
  }
  const allTimeSlots = generateTimeSlots();

  const buildingSelect = document.getElementById('building');
  const teacherSelect = document.getElementById('teacher');
  const timeSlotSelect = document.getElementById('timeSlot');
  const bookingForm = document.getElementById('bookingForm');
  const statusMessage = document.getElementById('statusMessage');
  
  const btnLogoAccess = document.getElementById('btnLogoAccess');
  const btnAdminTextAccess = document.getElementById('btnAdminTextAccess');
  const adminSection = document.getElementById('adminSection');
  const adminTeacherSelect = document.getElementById('adminTeacherSelect');
  const bookingListContainer = document.getElementById('bookingListContainer');
  const btnClearAllData = document.getElementById('btnClearAllData');

  loadTeachers();

  buildingSelect.addEventListener('change', function() {
    const buildingId = this.value;
    teacherSelect.innerHTML = '<option value="">-- Izvēlieties skolotāju --</option>';
    timeSlotSelect.innerHTML = '<option value="">-- Vispirms izvēlieties skolotāju --</option>';
    timeSlotSelect.disabled = true;

    if (buildingId && teachersData[buildingId]) {
      teachersData[buildingId].forEach(teacher => {
        const option = document.createElement('option');
        option.value = teacher;
        option.textContent = teacher;
        teacherSelect.appendChild(option);
      });
      teacherSelect.disabled = false;
    } else {
      teacherSelect.disabled = true;
    }
  });

  teacherSelect.addEventListener('change', async function() {
    const selectedTeacher = this.value;
    timeSlotSelect.innerHTML = '<option value="">-- Ielādē laikus... --</option>';
    timeSlotSelect.disabled = true;

    if (selectedTeacher) {
      const bookings = await getBookings();
      const takenSlots = bookings
        .filter(b => b.teacher === selectedTeacher)
        .map(b => b.time);

      const freeSlots = allTimeSlots.filter(time => !takenSlots.includes(time));

      timeSlotSelect.innerHTML = '<option value="">-- Izvēlieties laiku --</option>';
      if (freeSlots.length === 0) {
        timeSlotSelect.innerHTML = '<option value="">-- Visi laiki aizņemti --</option>';
        timeSlotSelect.disabled = true;
      } else {
        freeSlots.forEach(time => {
          const option = document.createElement('option');
          option.value = time;
          option.textContent = time;
          timeSlotSelect.appendChild(option);
        });
        timeSlotSelect.disabled = false;
      }
    }
  });

  bookingForm.addEventListener('submit', async function(e) {
    e.preventDefault();

    const selectedTeacher = teacherSelect.value;
    const selectedTime = timeSlotSelect.value;

    statusMessage.className = 'message';
    statusMessage.textContent = 'Pārbauda pieejamību...';
    statusMessage.style.display = 'block';

    const currentBookings = await getBookings();

    // Pārbaudām, vai laiks nav jau aizņemts
    const isTaken = currentBookings.some(b => b.teacher === selectedTeacher && b.time === selectedTime);

    if (isTaken) {
      statusMessage.className = 'message error';
      statusMessage.textContent = 'Šis laiks pie izvēlētā skolotāja tikko tika aizņemts!';
      return;
    }

    const newBooking = {
      building: buildingSelect.value,
      teacher: selectedTeacher,
      time: selectedTime,
      studentClass: document.getElementById('studentClass').value,
      studentName: document.getElementById('studentName').value,
      reason: document.getElementById('reason').value,
      createdAt: new Date().toLocaleString()
    };

    currentBookings.push(newBooking);
    const success = await saveBookings(currentBookings);

    if (success) {
      statusMessage.className = 'message success';
      statusMessage.textContent = `Pieteikums veiksmīgi saglabāts! Laiks: ${newBooking.time} pie ${newBooking.teacher}.`;
      bookingForm.reset();
      teacherSelect.disabled = true;
      timeSlotSelect.disabled = true;
    } else {
      statusMessage.className = 'message error';
      statusMessage.textContent = 'Kļūda saglabājot pieteikumu serverī!';
    }

    setTimeout(() => {
      statusMessage.style.display = 'none';
    }, 5000);
  });

  btnLogoAccess.addEventListener('click', function() {
    const password = prompt("Lūdzu, ievadiet paroli skatīšanai:");
    if (password === "Skatīt") {
      adminSection.style.display = 'block';
      btnClearAllData.style.display = 'none';
      alert("Piekļuve piešķirta (tikai skatīšanās režīms)!");
    } else if (password !== null) {
      alert("Nepareiza parole!");
    }
  });

  btnAdminTextAccess.addEventListener('click', function() {
    const password = prompt("Lūdzu, ievadiet administratora paroli:");
    if (password === "admin") {
      adminSection.style.display = 'block';
      btnClearAllData.style.display = 'block';
      alert("Piekļuve piešķirta (administratora režīms)!");
    } else if (password !== null) {
      alert("Nepareiza parole!");
    }
  });

  adminTeacherSelect.addEventListener('change', async function() {
    const selectedTeacher = this.value;
    bookingListContainer.innerHTML = 'Ielādē datus...';

    if (!selectedTeacher) {
      bookingListContainer.innerHTML = '';
      return;
    }

    const bookings = await getBookings();
    const teacherBookings = bookings
      .filter(b => b.teacher === selectedTeacher)
      .sort((a, b) => a.time.localeCompare(b.time));

    if (teacherBookings.length === 0) {
      bookingListContainer.innerHTML = '<p class="no-data">Šim skolotājam pašlaik nav neviena pieteikuma.</p>';
      return;
    }

    let tableHTML = `
      <table class="results-table">
        <thead>
          <tr>
            <th>Laiks</th>
            <th>Klase</th>
            <th>Skolēns</th>
            <th>Iemesls</th>
          </tr>
        </thead>
        <tbody>
    `;

    teacherBookings.forEach(b => {
      tableHTML += `
        <tr>
          <td><strong>${b.time}</strong></td>
          <td>${b.studentClass}</td>
          <td>${b.studentName}</td>
          <td>${b.reason}</td>
        </tr>
      `;
    });

    tableHTML += '</tbody></table>';
    bookingListContainer.innerHTML = tableHTML;
  });

  btnClearAllData.addEventListener('click', async function() {
    const confirmation = confirm("Vai tiešām vēlaties dzēst visus pieteikumu datus? Šo darbību nevar atcelt!");
    if (confirmation) {
      const success = await saveBookings([]);
      if (success) {
        bookingListContainer.innerHTML = '';
        adminTeacherSelect.value = '';
        alert("Visi dati veiksmīgi izdzēsti!");
      } else {
        alert("Kļūda dzēšot datus!");
      }
    }
  });

  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  document.addEventListener('keydown', function(e) {
    if (
      e.key === "F12" ||
      (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "i" || e.key === "J" || e.key === "j")) ||
      (e.ctrlKey && (e.key === "U" || e.key === "u"))
    ) {
      e.preventDefault();
    }
  });
</script>

</body>
</html>
